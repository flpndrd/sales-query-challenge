spring:
  application:
    name: sales-query-challenge
  datasource:
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    web:
      pageable:
        serialization-mode: via-dto
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: true
